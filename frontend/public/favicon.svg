<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- 行星渐变色 (紫色到深蓝色) -->
    <linearGradient id="planetGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- 星环渐变色 (亮粉色到亮橙色) -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- 剪裁路径：用于将星环完美地分割为前后两半 -->
    <clipPath id="front-clip">
      <rect x="-100" y="128" width="456" height="200" />
    </clipPath>
  </defs>

  <!-- 图标背景 (深邃的星空色/深色圆角底板) -->
  <rect width="256" height="256" rx="56" fill="#0F172A" />

  <!-- 装饰背景星星 -->
  <!-- 右上角四角星 -->
  <path d="M 210 30 C 210 42 215 45 225 45 C 215 45 210 48 210 60 C 210 48 205 45 195 45 C 205 45 210 42 210 30 Z" fill="#FBBF24" />
  <!-- 左中四角星 -->
  <g transform="translate(40, 100) scale(0.6) translate(-210, -45)">
    <path d="M 210 30 C 210 42 215 45 225 45 C 215 45 210 48 210 60 C 210 48 205 45 195 45 C 205 45 210 42 210 30 Z" fill="#FBBF24" />
  </g>
  <!-- 底部小点星 -->
  <g transform="translate(160, 225) scale(0.4) translate(-210, -45)">
    <path d="M 210 30 C 210 42 215 45 225 45 C 215 45 210 48 210 60 C 210 48 205 45 195 45 C 205 45 210 42 210 30 Z" fill="#F472B6" />
  </g>
  <circle cx="190" cy="95" r="2.5" fill="#FFFFFF" opacity="0.5" />
  <circle cx="65" cy="55" r="3" fill="#FFFFFF" opacity="0.6" />
  <circle cx="45" cy="200" r="2" fill="#FFFFFF" opacity="0.4" />

  <!-- 1. 星环后半部分 (置于行星底层) -->
  <!-- 运用了负空间设计，黑色的粗描边作为镂空，与背景融为一体 -->
  <g transform="rotate(20 128 128)">
    <ellipse cx="128" cy="128" rx="115" ry="32" fill="none" stroke="#0F172A" stroke-width="24" />
    <ellipse cx="128" cy="128" rx="115" ry="32" fill="none" stroke="url(#ringGrad)" stroke-width="12" />
  </g>

  <!-- 2. 行星本体 (兼具聊天气泡形状，象征论坛和对话) -->
  <path d="M 128 58 
           A 70 70 0 0 1 188.62 163 
           L 214 214 
           L 163 188.62 
           A 70 70 0 1 1 128 58 Z" 
        fill="url(#planetGrad)" stroke="#0F172A" stroke-width="12" stroke-linejoin="round" />

  <!-- 行星左上角的高光，增加立体感 -->
  <path d="M 76.4 109.2 A 55 55 0 0 1 109.2 76.4" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  <!-- 论坛正在输入状态符号 (聊天气泡核心点缀) -->
  <circle cx="88" cy="128" r="8" fill="#FFFFFF" />
  <circle cx="128" cy="128" r="8" fill="#FFFFFF" />
  <circle cx="168" cy="128" r="8" fill="#FFFFFF" />

  <!-- 3. 星环前半部分 (置于行星顶层) -->
  <!-- 使用 clip-path 精准切掉上半部分，完美实现 3D 环绕遮挡效果 -->
  <g transform="rotate(20 128 128)" clip-path="url(#front-clip)">
    <ellipse cx="128" cy="128" rx="115" ry="32" fill="none" stroke="#0F172A" stroke-width="24" />
    <ellipse cx="128" cy="128" rx="115" ry="32" fill="none" stroke="url(#ringGrad)" stroke-width="12" />
  </g>
</svg>