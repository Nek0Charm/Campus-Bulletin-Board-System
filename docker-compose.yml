services:
  postgres:
    image: postgres:18-alpine
    container_name: bbs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbs_password}
      POSTGRES_DB: bbs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbs_user} -d bbs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bbs-network

  redis:
    image: redis:7-alpine
    container_name: bbs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bbs-network

  backend:
    build: ./backend
    container_name: bbs-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bbs_user}:${POSTGRES_PASSWORD:-bbs_password}@postgres:5432/bbs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production-min-32-bytes}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@campus-bbs.local}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      EMAIL_VERIFY_TOKEN_EXPIRE_MINUTES: ${EMAIL_VERIFY_TOKEN_EXPIRE_MINUTES:-1440}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-bbs-media}
      S3_REGION: ${S3_REGION:-garage}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bbs-network

  frontend:
    build: ./frontend
    container_name: bbs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - bbs-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: bbs-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - bbs-network

  garage:
    image: dxflrs/garage:v1.1.0
    container_name: bbs-garage
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml
    environment:
      RUST_LOG: garage=info
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bbs-network

volumes:
  postgres_data:
  redis_data:
  garage_data:
  garage_meta:

networks:
  bbs-network:
    driver: bridge
