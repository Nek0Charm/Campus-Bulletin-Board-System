name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip CI check (use with caution)'
        type: boolean
        default: false

env:
  COMPOSE_SERVICES: postgres redis backend frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/bbs' }}
            git pull origin main
            docker compose up -d --build ${{ env.COMPOSE_SERVICES }}
            docker system prune -f