name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build images
        run: docker compose build backend frontend

      - name: Save images
        run: docker save bbs-backend:latest bbs-frontend:latest | gzip > images.tar.gz

      - name: Copy images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: images.tar.gz
          target: /tmp
          command_timeout: 60m

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Load images and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            docker load < /tmp/images.tar.gz
            rm /tmp/images.tar.gz
            cd ${{ secrets.DEPLOY_PATH || '/opt/bbs' }}
            git pull origin main
            docker compose up -d --no-build backend frontend
            docker compose up -d postgres redis garage
            docker system prune -f

